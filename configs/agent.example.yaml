# ModelRelay Agent 示例配置
# 复制为 agent.yaml 后按需修改。

node_id: gpu-001

# Relay 地址列表，priority 越小越优先（主备组网）。
relays:
  - url: "wss://relay-a.example.com:9443/agent/v1/connect"
    priority: 1
  - url: "wss://relay-b.example.com:9443/agent/v1/connect"
    priority: 2

tls:
  # Agent 客户端证书（由 certctl 签发，私钥只保存在本机）。
  cert: "/etc/model-agent/gpu-001.crt"
  key: "/etc/model-agent/gpu-001.key"
  # Relay 服务端 CA。
  ca: "/etc/model-agent/relay-ca.crt"
  insecure_skip_verify: false

local:
  # 本地 OpenAI-compatible 模型服务（只允许配置文件指定，防 SSRF）。
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "${LOCAL_MODEL_API_KEY}"
  tls_verify: true
  connect_timeout_sec: 5
  response_timeout_sec: 300
  max_concurrency: 8

probe:
  interval_sec: 600
  test_model: ""            # 留空则用模型列表第一个模型做轻量探测
  enabled:                  # 低消耗探测默认开启；高消耗项默认关闭
    - chat
    - chat_stream
    - completions
    - embeddings
    - responses
    - tools

heartbeat_interval: 20
log_level: info
